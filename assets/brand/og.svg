    <polygon points="256,150 171,260 341,260" fill="#2f7048"/>
    <polygon points="256,80 206,175 306,175" fill="#3e8e5a"/>
  </g>

  <!-- wordmark -->
  <text x="460" y="310" font-family="DejaVu Sans" font-weight="bold" font-size="96" fill="#26302a">token-forest</text>

  <!-- subtitle -->
