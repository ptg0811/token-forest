name: menubar-release

on:
  push:
    tags: ["menubar-v*"]

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build + test + bundle
        working-directory: clients/macos/TokenForest
        run: |
          swift test
          ./scripts/make-app.sh
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: clients/macos/TokenForest/build/TokenForest.zip
