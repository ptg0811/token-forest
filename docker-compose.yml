services:
  token-forest:
    build: .
    # Coolify/Traefik reaches the app over the compose network on 4700; the
    # loopback publish is for host-side fronting (e.g. `tailscale serve`) and
    # local smoke tests only.
    ports:
      - "127.0.0.1:4700:4700"
    # Local runs read .env from the repo; on Coolify the file is generated from
    # the UI-defined environment variables. Absent file is fine either way.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "4700"
      # In-cluster Mongo by service name. Overrides any MONGODB_URI in .env —
      # that value stays host-only (admin CLI, mongodump) and points at the
      # loopback publish below.
      MONGODB_URI: mongodb://mongo:27017/token-meter
    # Public-ingest path allowlist for a Traefik edge (Coolify). Set INGEST_HOST
    # (e.g. ingest.example.com) to activate; unset, the placeholder host matches
    # nothing and these routers stay inert. The allow router (priority 100) passes
    # only the five public paths; the block router (90) outranks the proxy's
    # auto-generated catch-all and rejects everything else on that host. The
    # "deny" is an ipallowlist no client can satisfy — Traefik has no plain
    # deny middleware.
    labels:
      - "traefik.http.routers.tf-ingest.rule=Host(`${INGEST_HOST:-ingest.invalid}`) && (PathPrefix(`/api/ingest`) || PathPrefix(`/api/limits`) || PathPrefix(`/install.sh`) || PathPrefix(`/uploader.tgz`) || PathPrefix(`/api/me/summary`))"
      - "traefik.http.routers.tf-ingest.entryPoints=https"
      - "traefik.http.routers.tf-ingest.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tf-ingest.priority=100"
      - "traefik.http.routers.tf-ingest.middlewares=gzip"
      - "traefik.http.routers.tf-block.rule=Host(`${INGEST_HOST:-ingest.invalid}`)"
      - "traefik.http.routers.tf-block.entryPoints=https"
      - "traefik.http.routers.tf-block.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tf-block.priority=90"
      - "traefik.http.routers.tf-block.middlewares=tf-deny"
      - "traefik.http.middlewares.tf-deny.ipallowlist.sourcerange=255.255.255.255/32"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    # Loopback-only publish so host-side admin tools (`pnpm member`, mongodump)
    # can reach the same DB. Pick a host port that no other MongoDB is using.
    ports:
      - "127.0.0.1:27201:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
