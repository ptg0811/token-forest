services:
  token-forest:
    build: .
    # Coolify/Traefik reaches the app over the compose network on 4700; the
    # loopback publish is for host-side fronting (e.g. `tailscale serve`) and
    # local smoke tests only.
    ports:
      - "127.0.0.1:4700:4700"
    # Local runs read .env from the repo; on Coolify the file is generated from
    # the UI-defined environment variables. Absent file is fine either way.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "4700"
      # In-cluster Mongo by service name. Overrides any MONGODB_URI in .env —
      # that value stays host-only (admin CLI, mongodump) and points at the
      # loopback publish below.
      MONGODB_URI: mongodb://mongo:27017/token-meter
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    # Loopback-only publish so host-side admin tools (`pnpm member`, mongodump)
    # can reach the same DB. Pick a host port that no other MongoDB is using.
    ports:
      - "127.0.0.1:27201:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Google-login gate for the dashboard. Coolify routes the app domain
  # (https://app.carbonlink.world:4180 in the Domains field) here; after auth
  # it forwards to the app with X-Forwarded-Email overwritten from the session
  # — the app trusts that header via TOKEN_FOREST_IDENTITY_HEADER.
  dashboard-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_PROVIDER: "google"
      OAUTH2_PROXY_EMAIL_DOMAINS: "renewearth-lab.com"
      OAUTH2_PROXY_UPSTREAMS: "http://token-forest:4700"
      OAUTH2_PROXY_REDIRECT_URL: "https://app.carbonlink.world/oauth2/callback"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    # OAUTH2_PROXY_CLIENT_ID / CLIENT_SECRET / COOKIE_SECRET come from the
    # Coolify-generated .env (UI-defined env vars) — never hardcode them here.
    env_file:
      - path: .env
        required: false
    depends_on:
      - token-forest
    restart: unless-stopped

volumes:
  mongo-data:
