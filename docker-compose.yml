services:
  token-forest:
    build: .
    # host networking: reaches the host's MongoDB on 127.0.0.1 and serves the
    # dashboard directly on PORT (no port mapping needed).
    network_mode: host
    env_file: .env
    environment:
      PORT: "4700"
      # Loopback only: with host networking, Next standalone would otherwise
      # inherit HOSTNAME=<host> and bind 127.0.1.1, unreachable from localhost.
      # Front the dashboard with an identity-aware proxy (see README) for auth.
      HOSTNAME: 127.0.0.1
      MONGODB_URI: ${MONGODB_URI}
      # This deployment fronts the app with `tailscale serve`, whose identity
      # headers are then trustworthy. Do NOT set this when exposing the port
      # any other way.
      TOKEN_FOREST_TRUST_TAILSCALE_HEADERS: "1"
      # First sync of any new connector backfills from the team tracking epoch.
      TOKEN_FOREST_BACKFILL_START: "2026-06-01"
      # OpenAI project ids whose API-key usage is product/service traffic, not
      # member usage. Set the comma-separated list in .env (see .env.example).
      OPENAI_EXCLUDE_PROJECTS: ${OPENAI_EXCLUDE_PROJECTS:-}
    restart: unless-stopped

  # 공개 수집 터널: /api/ingest·/api/limits·/install.sh 를 Cloudflare 로 노출해
  # 멤버가 Tailscale 없이 업로드하게 한다. 아웃바운드 전용(인바운드 포트 0).
  # 노출 경로 제한(그 외 403/404)은 Cloudflare 대시보드의 Public Hostname 라우팅에서
  # 강제된다 — 설계: docs/superpowers/specs/2026-07-21-cloudflare-tunnel-ingest-design.md
  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - token-forest
